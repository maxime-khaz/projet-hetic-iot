name: projet-hetic-iot

services:
  service-kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: service-kafka
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@service-kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://service-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "service-kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [iot-net]

  service-db:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [iot-net]

  service-producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: service-kafka:9092
    depends_on:
      service-kafka:
        condition: service_healthy
    restart: unless-stopped
    networks: [iot-net]

  service-airflow:
    build: ./airflow
    init: true
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW_HOME: /opt/airflow/state
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      MONGO_URL: mongodb://service-db:27017/iot
    volumes:
      - airflow-data:/opt/airflow/state
      - data-lake:/opt/airflow/data-lake
    depends_on:
      service-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [iot-net]

  service-spark:
    build: ./spark
    init: true
    environment:
      KAFKA_BOOTSTRAP: service-kafka:9092
      MONGO_URL: mongodb://service-db:27017/iot
      CHECKPOINT_DIR: /checkpoints
    volumes:
      - spark-checkpoints:/checkpoints
    depends_on:
      service-kafka:
        condition: service_healthy
      service-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [iot-net]

volumes:
  kafka-data:
  mongo-data:
  spark-checkpoints:
  airflow-data:
  data-lake:

networks:
  iot-net:
    driver: bridge